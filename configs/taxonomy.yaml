# Interest-point extraction + three-level taxonomy construction + tagging admission.

interest_points:
  base_model: Qwen/Qwen3-VL-32B-Instruct
  teacher: gpt-5.6                 # CoT distillation (~25k samples)
  reward: {rlaif_weight: 0.6, rlvr_weight: 0.4}
  luffy: {group_size: 8, off_policy_per_group: 1, shaping_gamma: 0.1}
  compute: {sft: "8x H100 80GB, ~1 day", rl: "16x H100 80GB, ~2 days"}

funnel:
  seed: "posts published > 1 year ago with high engagement (~10M+)"
  exact_dedup: true                # data-warehouse GROUP BY on normalised strings
  distance_threshold: 0.35         # cosine distance for synonym clustering
  method: auto                     # hierarchical (<= max_exact) else leader clustering
  max_exact: 20000

builder:
  l1: [影视综艺, 日常生活, 饮食餐饮, 游戏娱乐, 科学技术, 旅行]   # 50+ in production, expert-defined
  l2: {sample_budget: 1200, max_children: 20, max_reflection_rounds: 2}
  l3: {sample_budget: 300, max_children: 12, max_reflection_rounds: 2}
  inducer_families: [gpt, claude, gemini]
  coverage_test_sample: 100        # legacy hashtags mounted onto the new tree

tagging:
  l1_model: {base: Qwen/Qwen3-VL-8B-Instruct, data: 10000, labels: "3-model vote + human hard cases", compute: "4x A100, 12h"}
  l3_model: {base: Qwen/Qwen3-VL-8B-Instruct, data: 20000, labels: "GPT-5.6 3-step CoT", compute: "4x A100, 24h"}
  l2_model: null                   # not trained; L2 recovered from L3 by lookup

admission:
  weights: {likes: 1.0, favorites: 2.0, shares: 3.0, comments: 1.5}   # set by content operations
  tau: 500                          # strict: S > tau
  window_days: 30
  rescore_every_hours: 6
  blank_tag_trigger: 500
